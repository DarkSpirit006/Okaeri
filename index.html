    :root {
      --paper: #f5f3ed;
      --ink: #20231f;
      --muted: #777a71;
      --line: #d8d9d0;
      --accent: #e75c32;
      --accent-dark: #c64b26;
      --soft: #e9e9e1;
      --white: #fff;
      --radius: 4px;
      --sans: "DM Sans", Arial, sans-serif;
      --display: Manrope, Arial, sans-serif;
      --ease: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .topbar {
      height: 80px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 5.4%;
      gap: 70px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 800 25px/1 var(--display);
      letter-spacing: -1.7px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font: 700 18px var(--sans);
      border-radius: 50%;
    }

    .brand-dot,
    .footer-brand span {
      color: var(--accent);
    }

    nav {
      display: flex;
      align-self: stretch;
      gap: 38px;
    }

    nav a {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #777b72;
      white-space: nowrap;
      transition: color var(--ease);
    }

    nav a:hover,
    nav a.active {
      color: var(--ink);
    }

    nav a.active:after {
      content: "";
      position: absolute;
      height: 2px;
      background: var(--accent);
      left: 0;
      right: 0;
      bottom: 0;
    }

    .nav-count {
      font-size: 10px;
      border: 1px solid #c5c8bf;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }

    .header-note {
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #777a71;
      white-space: nowrap;
    }

    .live-dot,
    .orange-dot {
      display: inline-block;
      background: var(--accent);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .main-wrap {
      max-width: 1600px;
      margin: auto;
      padding: 0 5.4% 110px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 34px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #73776e;
    }

    .eyebrow-icon {
      font-size: 16px;
      color: var(--accent);
    }

    .eyebrow-line {
      height: 1px;
      flex: 1;
      background: var(--line);
      margin: 0 10px;
    }

    .issue {
      font-size: 9px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      padding: 53px 0 49px;
    }

    .section-label,
    .small-label {
      font-size: 10px;
      letter-spacing: 1.55px;
      font-weight: 700;
    }

    .section-label span {
      color: var(--accent);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font: 800 clamp(53px, 6vw, 91px)/0.99 var(--display);
      letter-spacing: -0.065em;
      margin-top: 22px;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .heading-aside {
      width: 244px;
      padding-bottom: 5px;
    }

    .asterisk {
      font-size: 32px;
      color: var(--accent);
      display: block;
      line-height: 1;
      margin-bottom: 20px;
    }

    .heading-aside p {
      font-size: 14px;
      line-height: 1.55;
      color: #62665d;
    }

    .aside-rule {
      height: 1px;
      background: var(--line);
      margin: 19px 0 12px;
    }

    .heading-aside>span:last-child {
      font-size: 9px;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #878980;
    }

    .compact {
      padding-bottom: 55px;
    }

    .feature {
      min-height: 383px;
      display: grid;
      grid-template-columns: 44% 56%;
      background: #e9eae2;
    }

    .feature-copy {
      padding: 25px 30px 22px 32px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .feature-kicker,
    .feature-bottom {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.25px;
      display: flex;
      align-items: center;
    }

    .feature-kicker .feature-number,
    .feature-bottom span {
      margin-left: auto;
      color: #8a8c83;
    }

    .feature-body {
      margin: auto 0;
      padding: 27px 0;
    }

    .feature-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1.4px;
      margin-bottom: 13px;
    }

    .feature-label span {
      margin-left: 8px;
    }

    .feature h2 {
      font: 800 clamp(24px, 2.8vw, 40px)/1.12 var(--display);
      letter-spacing: -0.05em;
      max-width: 500px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .feature-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-top: 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .feature-meta span+span:before {
      content: " / ";
      color: #a4a69d;
      margin: 0 10px;
    }

    .description {
      font-size: 13px;
      line-height: 1.65;
      color: #666a61;
      max-width: 470px;
      margin-top: 17px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .feature-actions {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-top: 25px;
    }

    .save {
      border: 0;
      background: #f8f8f2;
      color: var(--ink);
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      transition:
        background var(--ease),
        color var(--ease);
    }

    .save svg {
      width: 19px;
      height: 19px;
    }

    .save:hover,
    .save.saved {
      background: var(--accent);
      color: white;
    }

    .save.saved svg {
      fill: currentColor;
    }

    .save-big {
      width: auto;
      height: 43px;
      display: flex;
      gap: 9px;
      padding: 0 15px;
      background: var(--ink);
      color: white;
      font-size: 11px;
      font-weight: 700;
    }

    .save-big svg {
      width: 16px;
      height: 16px;
    }

    .details {
      font-size: 11px;
      font-weight: 700;
      border-bottom: 1px solid #9a9c92;
      padding: 7px 0;
    }

    .details span {
      margin-left: 5px;
    }

    .feature-bottom {
      padding-top: 12px;
      border-top: 1px solid #cdd0c6;
      color: #777b70;
    }

    .feature-art {
      position: relative;
      overflow: hidden;
      background: #c9cec2;
      min-height: 383px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.78);
    }

    .feature-art-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(32, 35, 31, 0.23), rgba(32, 35, 31, 0.12)),
        rgba(32, 35, 31, 0.13);
    }

    .feature-poster {
      position: relative;
      width: 190px;
      max-width: 38%;
      box-shadow: 0 16px 35px #0004;
      transform: rotate(-3deg);
    }

    .poster {
      position: relative;
      aspect-ratio: 2/3;
      background: #dcdfd4;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    .poster-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #a5aa9b;
      font-size: 48px;
      font-weight: 700;
    }

    .poster-fallback span {
      font-size: 9px;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }

    .art-caption {
      position: absolute;
      right: 24px;
      bottom: 23px;
      color: #fff;
      font: 700 10px/1.4 var(--display);
      letter-spacing: 0.1em;
    }

    .art-caption span {
      display: block;
      font-size: 24px;
      margin-top: 8px;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 17px;
      margin-top: 72px;
    }

    .small-label {
      color: var(--accent);
      margin-bottom: 9px;
    }

    .list-heading h2 {
      font: 800 24px var(--display);
      letter-spacing: -0.045em;
    }

    .list-right {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.3px;
      color: #7e8178;
      text-align: right;
    }

    .section-note {
      font-size: 12px;
      color: #777a71;
      margin: 16px 0 -5px;
      line-height: 1.5;
    }

    .grid,
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 38px 20px;
      margin-top: 24px;
    }

    .anime-card {
      min-width: 0;
    }

    .card-image {
      position: relative;
    }

    .card-image .save {
      position: absolute;
      z-index: 2;
      right: 10px;
      top: 10px;
    }

    .card-index {
      position: absolute;
      z-index: 2;
      bottom: 10px;
      left: 10px;
      background: var(--paper);
      padding: 5px 7px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .card-topline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--accent);
      font-size: 9px;
      letter-spacing: 1px;
      font-weight: 700;
      margin: 15px 0 8px;
    }

    .card-topline span {
      color: #777b70;
      white-space: nowrap;
    }

    .card-title {
      font: 800 15px/1.28 var(--display);
      letter-spacing: -0.025em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-title:hover {
      color: var(--accent);
    }

    .card-title span {
      font-size: 11px;
      color: #999;
    }

    .card-meta {
      font-size: 11px;
      color: #676b62;
      margin-top: 8px;
      line-height: 1.5;
    }

    .card-meta span {
      margin: 0 4px;
      color: #a3a69b;
    }

    .card-description {
      font-size: 11px;
      line-height: 1.5;
      color: #83867c;
      margin-top: 9px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-genres {
      color: #999c92;
      font-size: 10px;
      margin-top: 9px;
    }

    .load-wrap {
      text-align: center;
      margin-top: 50px;
    }

    .load-sentinel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 0 18px;
      min-height: 28px;
    }

    .load-spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      animation: load-spin 0.9s linear infinite;
    }

    @keyframes load-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .load-spinner {
        animation-duration: 2.4s;
      }
    }

    .load-more {
      min-width: 170px;
      background: transparent;
      border: 1px solid #a8aba1;
      padding: 15px 19px;
      font-size: 11px;
      font-weight: 700;
      transition:
        background var(--ease),
        color var(--ease);
    }

    .load-more:hover {
      background: var(--ink);
      color: white;
    }

    .load-more span {
      margin-left: 30px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px 90px;
    }

    .empty-symbol {
      font-size: 36px;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .empty h2 {
      font: 800 23px var(--display);
      letter-spacing: -0.04em;
    }

    .empty p {
      font-size: 13px;
      color: #75796e;
      line-height: 1.6;
      max-width: 370px;
      margin: 12px auto 20px;
    }

    .text-action {
      border: 0;
      background: none;
      border-bottom: 1px solid var(--accent);
      padding: 6px 0;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
    }

    .notice {
      padding: 14px 16px;
      background: #f4e3d8;
      color: #873f27;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }

    .skeleton-card>div {
      aspect-ratio: 2/3;
      background: #e3e5db;
      animation: pulse 1.4s infinite;
    }

    .skeleton-card i {
      display: block;
      background: #e3e5db;
      height: 10px;
      margin-top: 14px;
      width: 80%;
    }

    .skeleton-card i:last-child {
      width: 50%;
      margin-top: 10px;
    }

    @keyframes pulse {
      50% {
        opacity: 0.5;
      }
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 40px 5.4% 48px;
      display: flex;
      justify-content: space-between;
      align-items: end;
    }

    .footer-brand {
      font: 800 25px var(--display);
      letter-spacing: -1.5px;
    }

    footer p {
      color: #888b82;
      font-size: 11px;
      margin-top: 7px;
    }

    .footer-right {
      text-align: right;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 2.3;
      color: #8a8d84;
    }

    .footer-right span {
      color: var(--accent);
      font-size: 16px;
      margin-left: 10px;
    }

    .footer-right a {
      color: #55594f;
      text-decoration: underline;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: white;
      padding: 14px 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity var(--ease),
        transform var(--ease);
      z-index: 5;
      max-width: 90%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1000px) {
      .topbar {
        gap: 35px;
      }

      .header-note {
        display: none;
      }

      .grid,
      .skeleton-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .feature {
        grid-template-columns: 50% 50%;
      }

      .heading-aside {
        width: 200px;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        height: auto;
        min-height: 68px;
        padding: 16px 5% 0;
        display: block;
      }

      .brand {
        font-size: 22px;
        width: max-content;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        font-size: 16px;
      }

      nav {
        gap: 24px;
        overflow-x: auto;
        height: 51px;
        margin-top: 4px;
      }

      nav a {
        font-size: 12px;
      }

      .main-wrap {
        padding: 0 5% 75px;
      }

      .eyebrow {
        padding-top: 22px;
        font-size: 8px;
      }

      .issue {
        font-size: 8px;
      }

      .page-heading {
        padding: 42px 0 35px;
      }

      .page-heading h1 {
        font-size: clamp(48px, 11vw, 72px);
        margin-top: 17px;
      }

      .heading-aside {
        display: none;
      }

      .feature {
        display: flex;
        flex-direction: column-reverse;
      }

      .feature-art {
        min-height: 260px;
      }

      .feature-poster {
        width: 135px;
      }

      .feature-copy {
        padding: 20px;
      }

      .feature-body {
        padding: 25px 0;
      }

      .feature h2 {
        font-size: 27px;
      }

      .feature-meta {
        line-height: 1.8;
      }

      .feature-actions {
        margin-top: 20px;
      }

      .list-heading {
        margin-top: 52px;
      }

      .list-heading h2 {
        font-size: 21px;
      }

      .list-right {
        font-size: 8px;
        max-width: 120px;
        line-height: 1.5;
      }

      .grid,
      .skeleton-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px 14px;
      }

      .card-title {
        font-size: 14px;
      }

      .card-meta {
        font-size: 10px;
      }

      .card-topline {
        font-size: 8px;
      }

      .empty {
        padding: 65px 10px;
      }

      footer {
        padding: 30px 5%;
        gap: 20px;
      }

      .footer-right {
        font-size: 8px;
      }

      .footer-right span {
        display: none;
      }
    }

    @media (max-width: 340px) {
      nav {
        gap: 15px;
      }

      .feature-actions {
        gap: 12px;
      }

      .save-big {
        padding: 0 10px;
        font-size: 10px;
      }

      .issue {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Review refinements: accessible controls, contrast, and resilient text. */
    .skip-link {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 10;
      transform: translateY(-160%);
      background: var(--ink);
      color: #fff;
      padding: 12px 16px;
      font-size: 14px;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    h1:focus {
      outline: none;
    }

    .save {
      min-width: 44px;
      min-height: 44px;
    }

    .save-big {
      min-height: 44px;
    }

    .card-title,
    .feature h2,
    .description,
    .card-description,
    .card-meta {
      overflow-wrap: anywhere;
    }

    .card-description,
    .card-genres,
    .section-note,
    .empty p {
      color: #62665d;
    }

    .card-topline,
    .small-label,
    .feature-label {
      color: #b43e1e;
    }

    .save:hover,
    .save.saved {
      background: #b84424;
    }

    .list-right,
    .heading-aside>span:last-child,
    .feature-bottom,
    .footer-right,
    footer p {
      color: #666a61;
    }

    .poster-fallback {
      color: #687363;
    }

    .card-image .save:focus-visible {
      outline-offset: 2px;
    }

    .skeleton-grid {
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .feature-actions {
        flex-wrap: wrap;
      }

      .eyebrow-line {
        min-width: 10px;
      }

      .card-genres,
      .card-description {
        font-size: 11px;
      }

      .card-meta {
        font-size: 11px;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    nav a,
    .header-note,
    .eyebrow,
    .card-topline span {
      color: #60645b;
    }

    .section-label span,
    .text-action {
      color: #b43e1e;
    }

    .feature-kicker .feature-number,
    .feature-bottom span {
      color: #60645b;
    }

    /* Okaeri's editorial tracker layer. Existing palette and typographic identity are retained. */
    :root {
      --paper: #f5f3ed;
      --ink: #20231f;
      --muted: #62665d;
      --line: #d8d9d0;
      --accent: #d4532d;
      --accent-dark: #ad3d20;
      --surface: #e9eae2;
      --shadow: 0 12px 30px rgba(32, 35, 31, 0.13);
      --ease: 180ms ease;
    }

    .site-header {
      border-bottom: 1px solid var(--line);
      padding: 0 5.4%;
      background: var(--paper);
    }

    .header-main {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 32px;
      max-width: 1600px;
      margin: auto;
    }

    .brand {
      flex-shrink: 0;
    }

    .header-search {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      width: min(390px, 35vw);
      height: 42px;
      padding: 0 12px;
      background: #ebece5;
      border: 1px solid transparent;
      transition:
        border-color var(--ease),
        background var(--ease);
    }

    .header-search:focus-within {
      border-color: var(--accent);
      background: #fff;
    }

    .header-search svg,
    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
    }

    .header-search input {
      min-width: 0;
      width: 100%;
      background: transparent;
      border: 0;
      outline: 0;
      font: 500 12px var(--sans);
      color: var(--ink);
    }

    .header-search input::-webkit-search-cancel-button {
      display: none;
    }

    .header-search input::placeholder {
      color: #777b72;
    }

    .header-search kbd {
      font: 11px var(--sans);
      padding: 2px 6px;
      color: #767a70;
      border: 1px solid #cbd0c4;
    }

    .header-search button {
      border: 0;
      background: none;
      font-size: 22px;
      line-height: 1;
      color: #60645b;
    }

    .clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-width: 165px;
    }

    .clock-wrap time {
      font: 800 16px var(--display);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .clock-wrap span {
      font-size: 10px;
      color: #686c63;
      white-space: nowrap;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      transition:
        background var(--ease),
        border-color var(--ease);
    }

    .icon-button:hover {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .header-bottom {
      max-width: 1600px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      height: 49px;
    }

    .header-bottom nav {
      gap: 35px;
    }

    .sync-area {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #65695f;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .sync-area span:before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5f8673;
      margin-right: 7px;
    }

    .sync-area span[data-state="error"]:before {
      background: #ca642e;
    }

    .sync-area span[data-state="loading"]:before {
      background: #a48948;
    }

    .sync-area button {
      background: transparent;
      border: 0;
      width: 35px;
      height: 35px;
      font-size: 22px;
      color: #62665d;
      transition:
        transform var(--ease),
        color var(--ease);
    }

    .sync-area button:hover {
      color: var(--accent);
      transform: rotate(35deg);
    }

    .sync-area button:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    .main-wrap {
      padding-bottom: 100px;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      padding: 48px 0 42px;
    }

    .intro h1 {
      font-size: clamp(45px, 5.4vw, 76px);
      line-height: 1;
      letter-spacing: -0.065em;
      margin-top: 16px;
    }

    .intro h1 em {
      color: var(--accent);
    }

    .intro-aside {
      width: 220px;
      color: #666a61;
      font-size: 9px;
      letter-spacing: 0.12em;
      font-weight: 700;
      line-height: 1.5;
    }

    .intro-aside strong {
      font: 500 14px/1.5 var(--sans);
      letter-spacing: 0;
      display: block;
      color: #62665d;
    }

    .intro-aside .aside-rule {
      margin: 18px 0 10px;
    }

    .search-intro h1 {
      font-size: clamp(40px, 4.5vw, 64px);
    }

    .search-intro p {
      margin-top: 12px;
      color: #62665d;
      font-size: 14px;
    }

    .section-bar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 15px;
    }

    .section-bar h2 {
      font: 800 24px var(--display);
      letter-spacing: -0.045em;
    }

    .results-count {
      font-size: 9px;
      letter-spacing: 1.1px;
      font-weight: 700;
      color: #64685f;
      text-align: right;
    }

    .filters {
      display: flex;
      gap: 10px;
      align-items: end;
      margin-top: 20px;
    }

    .filter {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 170px;
    }

    .filter span,
    .field-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: #656960;
    }

    .filter select,
    .settings-group select,
    .input-suffix input {
      height: 42px;
      border: 1px solid #cfd2c7;
      background: transparent;
      color: var(--ink);
      padding: 0 32px 0 12px;
      font: 600 12px var(--sans);
      border-radius: 0;
      transition:
        border-color var(--ease),
        background var(--ease);
    }

    .filter select:hover,
    .settings-group select:hover {
      border-color: #747a6d;
      background: #eff0e9;
    }

    .section-note {
      margin: 15px 0 0;
      line-height: 1.6;
      max-width: 850px;
    }

    .notice {
      margin-top: 20px;
    }

    .inline-action {
      background: none;
      color: var(--accent-dark);
      font-weight: 700;
      border: 0;
      text-decoration: underline;
    }

    .tracker-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 42px 20px;
      margin-top: 24px;
    }

    .tracker-card {
      min-width: 0;
      transition: transform var(--ease);
    }

    .cover-wrap {
      position: relative;
      overflow: hidden;
      background: #d9ddd2;
      transition: box-shadow var(--ease);
    }

    .cover-open {
      border: 0;
      padding: 0;
      width: 100%;
      display: block;
      background: none;
      text-align: left;
    }

    .cover-open .poster img {
      transition:
        transform 350ms ease,
        opacity 250ms ease;
    }

    .cover-open:hover .poster img {
      transform: scale(1.035);
    }

    .tracker-card:hover .cover-wrap,
    .tracker-card:focus-within .cover-wrap {
      box-shadow: var(--shadow);
    }

    .tracker-card:hover {
      transform: translateY(-3px);
    }

    .cover-wrap .save {
      position: absolute;
      z-index: 2;
      right: 10px;
      top: 10px;
    }

    .episode-badge {
      position: absolute;
      z-index: 2;
      left: 10px;
      top: 10px;
      padding: 8px 9px;
      background: var(--paper);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    .tracker-card .card-topline {
      margin: 15px 0 7px;
      color: #ad3d20;
    }

    .tracker-card .card-topline span:last-child {
      color: #60645b;
    }

    .tracker-title {
      border: 0;
      background: none;
      padding: 0;
      text-align: left;
      color: var(--ink);
      font: 800 15px/1.32 var(--display);
      letter-spacing: -0.025em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .tracker-title:hover {
      color: var(--accent-dark);
    }

    .tracker-title span {
      font-size: 10px;
      color: #73796d;
    }

    .airing-label {
      margin-top: 11px;
      color: #a83b1f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .airing-label.past {
      color: #5e7664;
    }

    .card-time {
      color: #64685f;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 4px;
      min-height: 17px;
    }

    .card-progress {
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      margin-top: 13px;
      padding-top: 8px;
      color: #62665d;
      font-size: 10px;
      font-weight: 600;
    }

    .card-progress button {
      border: 1px solid #cfd2c7;
      background: transparent;
      min-width: 38px;
      min-height: 36px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      transition:
        background var(--ease),
        color var(--ease),
        border-color var(--ease);
    }

    .card-progress button:hover:not(:disabled) {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .card-progress button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .loading-more {
      text-align: center;
      color: #62665d;
      font-size: 12px;
      padding: 30px;
    }

    .empty {
      padding: 70px 20px;
    }

    .empty-symbol {
      color: var(--accent);
    }

    dialog {
      color: var(--ink);
      border: 0;
      padding: 0;
      background: var(--paper);
      box-shadow: 0 24px 80px #0005;
      max-height: min(90vh, 900px);
      overflow: auto;
    }

    dialog::backdrop {
      background: rgba(25, 29, 24, 0.65);
    }

    #detail-dialog {
      width: min(900px, calc(100% - 32px));
    }

    #settings-dialog {
      width: min(510px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      margin: auto 0 auto auto;
    }

    .dialog-close {
      position: absolute;
      right: 20px;
      top: 17px;
      border: 1px solid #b5baad;
      background: var(--paper);
      width: 42px;
      height: 42px;
      font-size: 24px;
      line-height: 1;
      z-index: 2;
      color: var(--ink);
      transition:
        background var(--ease),
        color var(--ease);
    }

    .dialog-close:hover {
      background: var(--ink);
      color: white;
    }

    .detail-banner {
      height: 145px;
      background: #cdd1c5;
      overflow: hidden;
    }

    .detail-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 32px;
      padding: 32px;
    }

    .detail-side .poster {
      box-shadow: 0 10px 25px #0002;
    }

    .external-link {
      display: block;
      border: 1px solid #aeb3a7;
      margin-top: 13px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      padding: 12px;
      transition:
        background var(--ease),
        color var(--ease);
    }

    .external-link:hover {
      background: var(--ink);
      color: white;
    }

    .detail-copy {
      min-width: 0;
    }

    .detail-copy h2,
    .settings-head h2 {
      font: 800 30px/1.12 var(--display);
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
      margin: 12px 40px 5px 0;
    }

    .detail-sub {
      font-size: 12px;
      color: #686c63;
      margin-top: 5px;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 18px 0;
    }

    .detail-tags span {
      font-size: 10px;
      font-weight: 700;
      background: #e5e8de;
      padding: 6px 8px;
    }

    .detail-genres {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 14px;
    }

    .detail-synopsis {
      font-size: 13px;
      line-height: 1.7;
      color: #595e55;
      max-height: 160px;
      overflow: auto;
    }

    .next-episode {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 13px 0;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: 18px;
      font-size: 10px;
    }

    .next-episode span {
      color: #62665d;
    }

    .detail-actions {
      margin-top: 18px;
      display: flex;
      gap: 20px;
      align-items: end;
      flex-wrap: wrap;
    }

    .primary-action,
    .secondary-action,
    .settings-actions button,
    .file-button {
      min-height: 42px;
      border: 1px solid var(--ink);
      padding: 10px 14px;
      background: var(--ink);
      color: white;
      font-size: 11px;
      font-weight: 700;
      transition:
        background var(--ease),
        color var(--ease);
    }

    .primary-action:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .progress-input label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #62665d;
      margin-bottom: 6px;
    }

    .progress-input>div {
      display: flex;
    }

    .progress-input input {
      width: 70px;
      height: 42px;
      border: 1px solid #bfc4b8;
      padding: 8px;
      background: transparent;
    }

    .progress-input button {
      min-width: 42px;
      background: #e8eae2;
      border: 1px solid #bfc4b8;
      border-left: 0;
      font-size: 11px;
      font-weight: 700;
    }

    .progress-input button:hover:not(:disabled) {
      background: var(--ink);
      color: white;
    }

    .progress-input button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #settings-content {
      padding: 32px;
    }

    .settings-head {
      position: relative;
      padding-right: 42px;
    }

    .settings-head .dialog-close {
      right: 0;
      top: 0;
    }

    .settings-head h2 span {
      color: var(--accent);
    }

    .settings-head p,
    .settings-group p {
      font-size: 12px;
      line-height: 1.65;
      color: #62665d;
      margin-top: 8px;
    }

    .settings-group {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin-top: 26px;
    }

    .settings-group h3 {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--accent-dark);
      margin-bottom: 16px;
    }

    .settings-group h3 span {
      color: var(--ink);
      font: 800 16px var(--display);
      letter-spacing: -0.03em;
      margin-left: 10px;
    }

    .settings-group select {
      width: 100%;
      margin: 7px 0 15px;
    }

    .field-label {
      display: block;
      margin-top: 15px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
      min-height: 35px;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-dark);
    }

    .input-suffix {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
      font-size: 12px;
    }

    .input-suffix input {
      width: 80px;
      padding: 8px;
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .settings-actions button,
    .file-button,
    .secondary-action {
      background: transparent;
      color: var(--ink);
      border-color: #aeb3a7;
    }

    .settings-actions button:hover,
    .file-button:hover,
    .secondary-action:hover {
      background: var(--ink);
      color: white;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .file-button input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .file-button:focus-within {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    #import-result {
      color: var(--accent-dark);
    }

    @media (max-width: 1000px) {
      .tracker-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .header-main {
        gap: 18px;
      }

      .header-search {
        width: min(330px, 38vw);
      }
    }

    @media (max-width: 700px) {
      .site-header {
        padding: 0 5%;
      }

      .header-main {
        height: auto;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        padding-top: 15px;
      }

      .brand {
        font-size: 22px;
      }

      .clock-wrap {
        min-width: 0;
      }

      .clock-wrap time {
        font-size: 14px;
      }

      .clock-wrap span {
        font-size: 9px;
      }

      .icon-button {
        width: 40px;
        height: 40px;
      }

      .header-search {
        grid-column: 1/-1;
        grid-row: 2;
        width: 100%;
        margin: 0;
      }

      .header-bottom {
        height: 52px;
      }

      .header-bottom nav {
        gap: 20px;
      }

      .header-bottom nav a {
        font-size: 11px;
      }

      .sync-area {
        gap: 2px;
        font-size: 8px;
      }

      .sync-area button {
        width: 28px;
      }

      .intro {
        padding: 38px 0 32px;
      }

      .intro h1 {
        font-size: clamp(45px, 10vw, 64px);
      }

      .intro-aside {
        display: none;
      }

      .section-bar h2 {
        font-size: 21px;
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .filter {
        min-width: 0;
      }

      .filter:first-child {
        grid-column: 1/-1;
      }

      .filter select {
        width: 100%;
      }

      .tracker-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 34px 14px;
      }

      .tracker-title {
        font-size: 14px;
      }

      .detail-layout {
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 17px;
        padding: 20px;
      }

      .detail-banner {
        height: 95px;
      }

      .detail-copy h2 {
        font-size: 22px;
      }

      .detail-actions {
        gap: 12px;
      }

      .detail-synopsis {
        max-height: 130px;
      }

      .external-link {
        padding: 10px 4px;
        font-size: 10px;
      }

      #settings-content {
        padding: 24px;
      }

      .card-progress {
        font-size: 10px;
      }
    }

    @media (max-width: 360px) {
      .header-bottom nav {
        gap: 12px;
      }

      .sync-area span {
        font-size: 0;
      }

      .sync-area span:before {
        margin: 0;
      }

      .intro h1 {
        font-size: 44px;
      }

      .detail-layout {
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 12px;
      }

      .detail-copy h2 {
        font-size: 20px;
      }

      .detail-actions {
        display: block;
      }

      .progress-input {
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 460px) {
      .sync-area span {
        font-size: 0;
      }

      .sync-area span:before {
        margin-right: 2px;
      }

      .header-bottom nav {
        gap: 16px;
      }
    }

    .zone-input {
      width: 100%;
      height: 42px;
      border: 1px solid #cfd2c7;
      background: transparent;
      padding: 0 12px;
      margin-top: 7px;
      font: 600 12px var(--sans);
      color: var(--ink);
    }

    .airing-label.past {
      color: #526b58;
    }

    @media (max-width: 460px) {
      .header-bottom {
        height: auto;
        flex-wrap: wrap;
      }

      .header-bottom nav {
        width: 100%;
        height: 44px;
      }

      .sync-area {
        width: 100%;
        min-height: 30px;
        justify-content: flex-end;
      }

      .sync-area span {
        font-size: 9px;
        white-space: nowrap;
      }

      .sync-area span:before {
        margin-right: 7px;
      }
    }

    .card-progress button {
      min-width: 44px;
      min-height: 44px;
    }

    /* Compact editorial introduction and appearance tokens. */
    :root {
      --surface-raised: #ebece5;
      --surface-hover: #eff0e9;
      --text-secondary: #62665d;
      --text-accent: #ad3d20;
      --control-border: #cfd2c7;
      --button-bg: #20231f;
      --button-text: #fff;
      --notice-bg: #f4e3d8;
      --notice-text: #873f27;
      --skeleton-bg: #e3e5db;
      --poster-bg: #dcdfd4;
      --poster-text: #687363;
      --tag-bg: #e5e8de;
      --toast-bg: #20231f;
      --toast-text: #fff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --paper: #171b19;
      --ink: #f0eee7;
      --muted: #b0b7aa;
      --line: #39413b;
      --surface: #222923;
      --surface-raised: #252c27;
      --surface-hover: #303b32;
      --text-secondary: #b0b7aa;
      --text-accent: #ffad8b;
      --accent: #f08a66;
      --accent-dark: #ffad8b;
      --control-border: #515b52;
      --button-bg: #f0eee7;
      --button-text: #20231f;
      --notice-bg: #422d25;
      --notice-text: #ffd6c2;
      --skeleton-bg: #303b32;
      --poster-bg: #2d3830;
      --poster-text: #bac5b4;
      --tag-bg: #303b32;
      --toast-bg: #f0eee7;
      --toast-text: #20231f;
      --shadow: 0 12px 30px rgba(0, 0, 0, .42);
    }

    .eyebrow {
      padding-top: 24px;
    }

    .intro {
      padding: 25px 0 23px;
      gap: 24px;
    }

    .intro h1 {
      font-size: clamp(36px, 3.3vw, 49px);
      line-height: 1.05;
      margin-top: 10px;
    }

    .intro h1 em {
      margin-left: .1em;
    }

    .theme-value {
      display: none;
    }

    .intro-aside {
      width: 220px;
    }

    .intro-aside .aside-rule {
      margin: 10px 0 7px;
    }

    .search-intro h1 {
      font-size: clamp(34px, 3.1vw, 46px);
    }

    .theme-control {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 42px;
      padding: 0 9px;
      border: 1px solid var(--line);
      color: var(--text-secondary);
      background: transparent;
      transition: border-color var(--ease), background var(--ease);
    }

    .theme-control:hover,
    .theme-control:focus-within {
      border-color: var(--control-border);
      background: var(--surface-raised);
    }

    .theme-control svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      flex-shrink: 0;
    }

    .theme-control select {
      border: 0;
      padding: 4px 2px;
      background: transparent;
      color: var(--ink);
      font: 600 11px var(--sans);
      cursor: pointer;
    }

    .theme-control select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Components consume the same tokens in both themes; artwork remains untouched. */
    .header-search {
      background: var(--surface-raised);
    }

    .header-search:focus-within {
      background: var(--surface-hover);
    }

    .header-search input::placeholder,
    .header-search kbd,
    .header-search button,
    .clock-wrap span,
    .search-intro p,
    .list-right,
    .sync-area,
    .sync-area button,
    .intro-aside,
    .intro-aside strong,
    .results-count,
    .filter span,
    .field-label,
    .section-note,
    .card-time,
    .card-progress,
    .detail-sub,
    .detail-synopsis,
    .next-episode span,
    .progress-input label,
    .settings-head p,
    .settings-group p,
    .loading-more,
    .empty p,
    footer p,
    .footer-right,
    .eyebrow,
    nav a,
    .tracker-card .card-topline span:last-child {
      color: var(--text-secondary);
    }

    .header-search kbd,
    .filter select,
    .settings-group select,
    .input-suffix input,
    .card-progress button,
    .progress-input input,
    .progress-input button,
    .zone-input,
    .dialog-close,
    .external-link,
    .settings-actions button,
    .file-button,
    .secondary-action {
      border-color: var(--control-border);
    }

    .filter select:hover,
    .settings-group select:hover {
      background: var(--surface-hover);
      border-color: var(--control-border);
    }

    .poster,
    .cover-wrap,
    .detail-banner {
      background: var(--poster-bg);
    }

    .poster-fallback {
      color: var(--poster-text);
    }

          if (Date.now() - Math.max(state[kind].syncedAt, state[kind].attemptedAt) > 15 * 6e4)
            loadSchedule(kind, { reset: true });
        }
      });
      setInterval(() => {
        if (!document.hidden) {
          const kind = section === "recent" ? "recent" : "upcoming";
          if (!state[kind].loading && Date.now() - Math.max(state[kind].syncedAt, state[kind].attemptedAt) > 15 * 6e4)
            loadSchedule(kind, { reset: true });
        }
      }, 6e4);
      (async function init() {
        for (const kind of ["upcoming", "recent"]) {
          const c = await readCache(kind);
          if (c && Array.isArray(c.events) && Number.isInteger(c.page) && Number.isFinite(c.anchor)) {
            try {
              const events = validEvents(
                c.events.map((e) => ({
                  ...e,
                  media: { ...e.media, type: "ANIME", isAdult: false }

                events,
                page: c.page,
                more: !!c.more,
                anchor: c.anchor,
                syncedAt: c.syncedAt || 0,
                source: "cache"
              });
            } catch {
            }
          }
        }
        changeSection();
        ticker();
        loadSchedule("upcoming", { reset: true });
      })();
    })();
